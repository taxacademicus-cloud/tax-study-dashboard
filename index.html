<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tax Academics | Study Lab</title><link rel="stylesheet" href="style.css"></head><body>
<div id="auth" class="auth"><div class="login"><div class="brand">✦ TAX ACADEMICS</div><h1>Study Lab</h1><p>세무사 1차 시험 · 개인 학습 연구실</p><form id="loginForm"><label>이메일<input id="email" type="email" required autocomplete="username"></label><label>비밀번호<input id="password" type="password" required autocomplete="current-password"></label><button type="submit">로그인</button></form><p id="authMessage" class="message"></p><small>계정은 Firebase 콘솔에서 관리자만 생성합니다.</small></div></div>
<div id="app" class="hidden"><header><div class="brand">✦ TAX ACADEMICS <span> / STUDY LAB</span></div><div class="header-actions"><span id="saveStatus">저장 준비</span><button id="exportBtn" class="secondary">JSON 백업</button><button id="logoutBtn" class="secondary">로그아웃</button></div></header><div class="shell"><aside><div class="aside-title">학습 공간</div><button class="nav active" data-subject="all">▦ 전체 학습 현황</button><div class="aside-title">1차 시험</div><div id="subjects"></div><div class="aside-title">2차 시험</div><button class="nav" disabled>🔒 준비 중</button><div class="aside-title">도구</div><button id="importBtn" class="nav">↥ JSON 백업 복원</button><input type="file" id="importFile" accept="application/json" hidden><p class="aside-note">내용은 로그인 계정에 저장됩니다.</p></aside><main><div class="breadcrumb" id="breadcrumb">1차 시험</div><div class="pagehead"><div><h1 id="pageTitle">학습 현황</h1><p id="pageDesc">주제별 지식을 연결하고 영상 자료로 발전시키세요.</p></div><button id="addTopic" class="hidden">+ 새 주제</button></div><div id="overview"></div><div id="workspace" class="hidden"><div class="topic-toolbar"><input id="topicSearch" placeholder="주제 검색"><select id="topicSelect" aria-label="주제 선택"></select><button id="deleteTopic" class="danger secondary">주제 삭제</button></div><div class="editor-grid"><section class="panel"><div class="panel-title">학습 노트 <span class="muted">자동 저장</span></div><label>주제명<input id="topicTitle" placeholder="주제명"></label><label>핵심 개념<textarea id="concept" rows="3" placeholder="핵심 개념과 정의"></textarea></label><label>상세 설명<textarea id="details" rows="7" placeholder="이론, 수식, 예시 등을 정리하세요"></textarea></label><label>시험 포인트<textarea id="examPoints" rows="3" placeholder="기출 논점과 주의사항"></textarea></label><label>영상 제작 메모<textarea id="videoNotes" rows="3" placeholder="촬영 구성, 설명 순서, 대본 아이디어"></textarea></label><div class="panel-title">이미지 자료</div><label class="upload">+ 이미지 첨부<input id="imageUpload" type="file" accept="image/*" multiple hidden></label><div id="images" class="images"></div></section><section class="panel map-panel"><div class="panel-title">마인드맵 <span class="muted">노드를 클릭해 편집</span></div><div class="map-controls"><button id="addNode" class="secondary">+ 노드</button><button id="addChild" class="secondary">+ 하위 노드</button><button id="removeNode" class="secondary danger">노드 삭제</button><button id="resetMap" class="secondary">배치 정리</button></div><div id="map" class="map"><svg id="mindmap" viewBox="0 0 780 520" role="img" aria-label="마인드맵"></svg></div><div class="node-editor"><label>선택 노드<input id="nodeLabel" placeholder="노드를 선택하세요"></label><label>노드 설명<textarea id="nodeNote" rows="3" placeholder="노드와 연결된 개념 설명"></textarea></label><p class="muted">노드를 드래그해 이동할 수 있습니다. 하위 노드는 선택한 노드와 연결됩니다.</p></div></section></div></div></main></div></div>
<script type="module" src="app.js"></script></body></html>
